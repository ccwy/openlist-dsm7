name: 自动检测并同步 OpenList 新版本
run-name: 🔄 同步 OpenList ${{ github.event.inputs.version || '最新版本' }}

on:
  # 定时调度：每 6 小时检查一次上游是否有新版本
  schedule:
    - cron: '0 */6 * * *'

  # 手动触发
  workflow_dispatch:
    inputs:
      version:
        description: '指定版本号 (留空则自动检测最新)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  sync:
    name: 🔄 检测并同步
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.sync.outputs.version }}
      status: ${{ steps.sync.outputs.status }}
      download_dir: ${{ steps.sync.outputs.download_dir }}
      spk_dir: ${{ steps.sync.outputs.spk_dir }}

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # 需要完整历史来检查 tags

      - name: 🔄 同步二进制 + 打包 SPK
        id: sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/sync-binaries.sh

          ARGS=""
          if [ -n "${{ github.event.inputs.version }}" ]; then
            ARGS="${{ github.event.inputs.version }}"
          fi

          # 运行脚本，即使失败也捕获输出
          set +e
          OUTPUT=$(./scripts/sync-binaries.sh $ARGS 2>&1)
          EXIT_CODE=$?
          set -e

          echo "$OUTPUT"

          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ Script failed with exit code $EXIT_CODE"
            echo "status=error" >> $GITHUB_OUTPUT
            exit 1
          fi

          # 解析结果
          RESULT=$(echo "$OUTPUT" | grep -E '^(SKIP|DONE):' | head -1)
          if [[ "$RESULT" == SKIP:* ]]; then
            VERSION="${RESULT#SKIP:}"
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            echo "status=skip" >> $GITHUB_OUTPUT
          elif [[ "$RESULT" == DONE:* ]]; then
            VERSION="${RESULT#DONE:}"
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            echo "status=done" >> $GITHUB_OUTPUT
            # 提取工作目录路径
            DOWNLOAD_DIR=$(echo "$OUTPUT" | grep '^DOWNLOAD_DIR:' | cut -d: -f2-)
            SPK_DIR=$(echo "$OUTPUT" | grep '^SPK_DIR:' | cut -d: -f2-)
            echo "download_dir=${DOWNLOAD_DIR}" >> $GITHUB_OUTPUT
            echo "spk_dir=${SPK_DIR}" >> $GITHUB_OUTPUT
            # 验证目录存在且有文件
            echo "Verifying download dir: ${DOWNLOAD_DIR}"
            ls -la "${DOWNLOAD_DIR}" | head -5
            echo "File count: $(ls -1 "${DOWNLOAD_DIR}" | wc -l)"
            echo "Verifying SPK dir: ${SPK_DIR}"
            ls -la "${SPK_DIR}"
          else
            echo "❌ Unexpected output, no SKIP or DONE found"
            echo "status=error" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: 📤 提交校验文件到仓库
        if: steps.sync.outputs.status == 'done'
        run: |
          VERSION="${{ steps.sync.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add checksums/v${VERSION}/ || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: add checksums for OpenList v${VERSION}"
            git push origin main
          fi

      - name: 🏷️ 创建 Git Tag
        if: steps.sync.outputs.status == 'done'
        run: |
          VERSION="${{ steps.sync.outputs.version }}"
          # 检查 tag 是否已存在
          if git tag -l "v${VERSION}" | grep -q .; then
            echo "Tag v${VERSION} already exists, skipping"
          else
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
          fi

      - name: 🚀 发布到 GitHub Releases（二进制 + SPK）
        if: steps.sync.outputs.status == 'done'
        run: |
          VERSION="${{ steps.sync.outputs.version }}"
          DOWNLOAD_DIR="${{ steps.sync.outputs.download_dir }}"
          SPK_DIR="${{ steps.sync.outputs.spk_dir }}"

          echo "=== Upload to GitHub Release v${VERSION} ==="
          echo "Download dir: ${DOWNLOAD_DIR}"
          echo "SPK dir: ${SPK_DIR}"

          # 验证目录存在
          if [ ! -d "$DOWNLOAD_DIR" ]; then
            echo "❌ Download dir does not exist: $DOWNLOAD_DIR"
            exit 1
          fi
          if [ ! -d "$SPK_DIR" ]; then
            echo "❌ SPK dir does not exist: $SPK_DIR"
            exit 1
          fi

          # 收集所有要上传的文件
          UPLOAD_FILES=()

          # 二进制文件
          for f in "$DOWNLOAD_DIR"/*; do
            if [ -f "$f" ]; then
              UPLOAD_FILES+=("$f")
            fi
          done

          # SPK 文件
          for f in "$SPK_DIR"/*.spk; do
            if [ -f "$f" ]; then
              UPLOAD_FILES+=("$f")
            fi
          done

          echo "=== Files to upload (${#UPLOAD_FILES[@]} total) ==="
          for f in "${UPLOAD_FILES[@]}"; do
            echo "  $(basename "$f") ($(du -h "$f" | cut -f1))"
          done

          if [ ${#UPLOAD_FILES[@]} -eq 0 ]; then
            echo "❌ No files to upload!"
            exit 1
          fi

          # 创建 release 并上传所有文件
          # 如果 release 已存在则上传到已有 release
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists, uploading files to it..."
            gh release upload "v${VERSION}" "${UPLOAD_FILES[@]}" --clobber
          else
            gh release create "v${VERSION}" \
              --title "OpenList v${VERSION}" \
              --notes "## OpenList v${VERSION}

          ### 📦 SPK 安装包（Synology DSM 7）

          | 文件 | 架构 | 适用型号 |
          |------|------|---------|
          | \`openlist-dsm7_x64_v${VERSION}.spk\` | x86_64 | DS224+, DS920+, DS1522+ 等 |
          | \`openlist-dsm7_arm64_v${VERSION}.spk\` | ARM64 | DS423+, DS623slim 等 |

          **安装方法**：DSM 套件中心 → 手动安装 → 上传 SPK → 访问 http://<NAS-IP>:5244

          ### 📁 上游二进制文件

          以下文件来自 [OpenList v${VERSION}](https://github.com/openlistteam/openlist/releases/tag/v${VERSION})，直接转载存储，文件名已加版本号。

          ### 🔐 校验

          MD5 校验文件已存入仓库 \`checksums/v${VERSION}/\` 目录。

          ---
          *此 Release 由自动同步工作流生成*" \
              "${UPLOAD_FILES[@]}"
          fi

          echo "=== Upload complete ==="
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🧹 清理工作目录
        if: always()
        run: |
          rm -rf .sync-work
          echo "Cleaned up .sync-work"
